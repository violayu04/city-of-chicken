<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>懦夫之城</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap');

  :root {
    --bg: #0e0e10;
    --bg2: #18181c;
    --bg3: #222228;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.15);
    --text: #f0ede8;
    --text2: #9e9b95;
    --text3: #5c5a56;
    --gold: #c9a84c;
    --gold2: #e8c97a;
    --red: #c94c4c;
    --green: #4caa7c;
    --blue: #4c7ec9;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: .5;
  }

  .wrap { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

  h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(28px, 6vw, 42px);
    font-weight: 700;
    letter-spacing: .05em;
    color: var(--gold2);
    margin-bottom: 4px;
  }
  .tagline { font-size: 13px; color: var(--text3); letter-spacing: .1em; margin-bottom: 2rem; }

  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
  }
  .card-title {
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 1rem;
  }

  input, select {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 9px 12px;
    outline: none;
    transition: border-color .2s;
    width: 100%;
  }
  input:focus, select:focus { border-color: var(--gold); }
  input[type=number] { text-align: center; padding: 7px 4px; }
  select { background-image: none; }

  .btn {
    background: transparent;
    border: 1px solid var(--border2);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 9px 20px;
    cursor: pointer;
    transition: all .2s;
    letter-spacing: .03em;
  }
  .btn:hover { background: var(--bg3); border-color: var(--gold); color: var(--gold); }
  .btn-gold {
    background: var(--gold);
    border-color: var(--gold);
    color: #0e0e10;
    font-weight: 500;
  }
  .btn-gold:hover { background: var(--gold2); border-color: var(--gold2); color: #0e0e10; }
  .btn-sm { padding: 6px 14px; font-size: 12px; }

  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    color: var(--text2);
  }
  .badge-gold { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,.08); }
  .badge-green { border-color: var(--green); color: var(--green); background: rgba(76,170,124,.08); }
  .badge-red { border-color: var(--red); color: var(--red); background: rgba(201,76,76,.08); }

  /* screens */
  .screen { display: none; }
  .screen.active { display: block; }

  /* lobby */
  .room-code {
    font-family: 'Noto Serif SC', serif;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: .2em;
    color: var(--gold2);
    text-align: center;
    padding: 1rem 0;
  }
  .room-hint { font-size: 12px; color: var(--text3); text-align: center; margin-top: 4px; }

  /* player list */
  .player-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .player-item:last-child { border-bottom: none; }
  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 500;
    flex-shrink: 0;
  }
  .player-info { flex: 1; }
  .player-name { font-size: 14px; font-weight: 400; }
  .player-role { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .player-status { font-size: 11px; }

  /* deploy */
  .city-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 1rem;
  }
  .city-cell { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .city-num {
    font-size: 11px;
    color: var(--text3);
  }
  .city-double { font-size: 10px; color: var(--gold); }
  .city-cell input { width: 100%; }

  .army-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    margin-bottom: 1rem;
  }
  .army-track {
    flex: 1;
    height: 4px;
    background: var(--bg3);
    border-radius: 2px;
    overflow: hidden;
  }
  .army-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 2px;
    transition: width .2s;
  }
  .army-count { font-size: 13px; color: var(--text2); min-width: 48px; text-align: right; }
  .army-warn { color: var(--red); }

  /* results */
  .city-result-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 1rem;
  }
  .city-result-cell {
    background: var(--bg3);
    border-radius: 8px;
    padding: 8px 6px;
    text-align: center;
    border: 1px solid var(--border);
  }
  .city-result-cell.won { border-color: var(--gold); background: rgba(201,168,76,.06); }
  .city-result-cell.tie { border-color: var(--border2); opacity: .5; }
  .city-pts { font-size: 11px; color: var(--text3); margin-bottom: 2px; }
  .city-winner { font-size: 12px; color: var(--gold); font-weight: 500; }
  .city-tie { font-size: 11px; color: var(--text3); }

  /* scoreboard */
  .score-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .score-row:last-child { border-bottom: none; }
  .score-rank { font-size: 18px; font-weight: 700; font-family: 'Noto Serif SC', serif; width: 28px; text-align: center; color: var(--text3); }
  .score-rank.r1 { color: var(--gold2); }
  .score-rank.r2 { color: #b0b8c8; }
  .score-rank.r3 { color: #c9956c; }
  .score-pts { margin-left: auto; font-size: 20px; font-weight: 600; font-family: 'Noto Serif SC', serif; color: var(--gold); }
  .score-delta { font-size: 11px; color: var(--text3); text-align: right; margin-top: 1px; }

  /* toast */
  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 13px;
    color: var(--text);
    transition: transform .3s;
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* waiting */
  .waiting-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .waiting-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--text2);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border2); flex-shrink: 0; }
  .dot.done { background: var(--green); }
  .dot.me { background: var(--gold); }

  /* role card */
  .my-role-card {
    background: var(--bg3);
    border: 1px solid var(--gold);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
  }
  .my-role-name { font-family: 'Noto Serif SC', serif; font-size: 18px; color: var(--gold2); margin-bottom: 4px; }
  .my-role-skill { font-size: 12px; color: var(--text2); line-height: 1.6; }

  .divider { height: 1px; background: var(--border); margin: 1rem 0; }

  .flex-row { display: flex; gap: 8px; align-items: center; }
  .flex-row-sb { display: flex; gap: 8px; align-items: center; justify-content: space-between; }

  .input-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .input-row input { flex: 1; }

  .step { display: flex; gap: 12px; margin-bottom: 14px; }
  .step-num {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--bg3); border: 1px solid var(--border2);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 500; color: var(--gold);
    flex-shrink: 0; margin-top: 1px;
  }
  .step-text { font-size: 13px; color: var(--text2); line-height: 1.7; }

  .phase-label {
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 6px;
  }

  .submitted-overlay {
    text-align: center;
    padding: 2rem 0;
    color: var(--text2);
  }
  .submitted-icon { font-size: 40px; margin-bottom: 8px; }

  .role-select-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 1rem;
  }
  .role-option {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    transition: all .2s;
  }
  .role-option:hover { border-color: var(--border2); }
  .role-option.selected { border-color: var(--gold); background: rgba(201,168,76,.06); }
  .role-option-name { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
  .role-option-skill { font-size: 11px; color: var(--text3); line-height: 1.5; }

  @media(max-width:480px) {
    .city-grid { grid-template-columns: repeat(4,1fr); gap: 5px; }
    .city-result-grid { grid-template-columns: repeat(4,1fr); }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>懦夫之城</h1>
  <p class="tagline">CITY OF CHICKEN · 12人 · 16城 · 六轮</p>

  <!-- 首页：创建或加入 -->
  <div class="screen active" id="screen-home">
    <div class="card">
      <div class="card-title">主持人 · 创建房间</div>
      <div class="input-row">
        <input id="host-name" placeholder="你的名字" maxlength="8" />
        <button class="btn btn-gold" onclick="createRoom()">创建</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">玩家 · 加入房间</div>
      <div class="input-row">
        <input id="join-code" placeholder="房间码（4位字母）" maxlength="4" style="text-transform:uppercase;letter-spacing:.15em" oninput="this.value=this.value.toUpperCase()" />
        <input id="join-name" placeholder="你的名字" maxlength="8" style="flex:.8" />
      </div>
      <button class="btn btn-gold" style="width:100%" onclick="joinRoom()">加入</button>
    </div>
  </div>

  <!-- 大厅 -->
  <div class="screen" id="screen-lobby">
    <div class="flex-row-sb" style="margin-bottom:1rem">
      <div>
        <div class="phase-label">房间码</div>
        <div class="room-code" id="lobby-code"></div>
        <div class="room-hint">将此房间码发给其他玩家</div>
      </div>
      <div id="host-controls"></div>
    </div>

    <div class="card">
      <div class="card-title">玩家列表 (<span id="player-count">0</span>/12)</div>
      <div id="player-list"></div>
    </div>

    <div class="card" id="role-assignment-card" style="display:none">
      <div class="card-title">选择你的角色（选4个，系统尽量安排）</div>
      <div class="role-select-grid" id="role-select-grid"></div>
      <button class="btn btn-gold" style="width:100%" onclick="submitRolePref()">提交偏好</button>
    </div>
  </div>

  <!-- 部署阶段 -->
  <div class="screen" id="screen-deploy">
    <div class="flex-row-sb" style="margin-bottom:1rem">
      <div>
        <div class="phase-label" id="round-label">第1轮</div>
        <div style="font-size:20px;font-weight:500" id="deploy-title">秘密部署军队</div>
      </div>
      <span class="badge" id="round-badge">1/6</span>
    </div>

    <div class="my-role-card" id="my-role-display"></div>

    <div id="deploy-form">
      <div class="army-bar">
        <span style="font-size:12px;color:var(--text3)">已部署</span>
        <div class="army-track"><div class="army-fill" id="army-fill" style="width:0%"></div></div>
        <span class="army-count" id="army-count">0 / 12</span>
      </div>
      <div class="city-grid" id="city-grid"></div>
      <button class="btn btn-gold" style="width:100%" onclick="submitDeploy()">提交部署（对其他人隐藏）</button>
    </div>

    <div class="submitted-overlay" id="submitted-overlay" style="display:none">
      <div class="submitted-icon">🏰</div>
      <div style="font-size:16px;font-weight:500;margin-bottom:6px">已提交！</div>
      <div style="font-size:13px;color:var(--text3);margin-bottom:1.5rem">等待其他玩家提交中…</div>
      <div class="waiting-list" id="waiting-list"></div>
    </div>
  </div>

  <!-- 结算 -->
  <div class="screen" id="screen-result">
    <div class="flex-row-sb" style="margin-bottom:1rem">
      <div>
        <div class="phase-label" id="result-round-label">第1轮</div>
        <div style="font-size:20px;font-weight:500">结算结果</div>
      </div>
      <span class="badge badge-gold" id="result-round-badge">1/6</span>
    </div>

    <div class="card">
      <div class="card-title">城池归属</div>
      <div class="city-result-grid" id="city-result-grid"></div>
    </div>

    <div class="card">
      <div class="card-title">本轮得分</div>
      <div id="round-scores"></div>
    </div>

    <div id="host-next-btn" style="display:none">
      <button class="btn btn-gold" style="width:100%" onclick="nextRound()">开始下一轮 →</button>
    </div>
    <div id="game-over-btn" style="display:none">
      <button class="btn btn-gold" style="width:100%" onclick="showFinal()">查看最终排名 →</button>
    </div>
  </div>

  <!-- 最终排名 -->
  <div class="screen" id="screen-final">
    <div style="margin-bottom:1.5rem">
      <div class="phase-label">游戏结束</div>
      <div style="font-size:24px;font-weight:600;font-family:'Noto Serif SC',serif;color:var(--gold2)">最终排名</div>
    </div>
    <div class="card">
      <div id="final-scores"></div>
    </div>
    <button class="btn" style="width:100%;margin-top:1rem" onclick="location.reload()">再来一局</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, set, get, push, onValue, update, remove } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

// ══════════════════════════════════════════
// 🔥 在下面填入你的 Firebase 配置
// ══════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyAqKrU7otqNaaA9Af-BcnalYwOQPnGP08E",
  authDomain: "favorable-axe-466805-g1.firebaseapp.com",
  databaseURL: "https://favorable-axe-466805-g1-default-rtdb.firebaseio.com",
  projectId: "favorable-axe-466805-g1",
  storageBucket: "favorable-axe-466805-g1.firebasestorage.app",
  messagingSenderId: "445742318052",
  appId: "1:445742318052:web:7a2acbdfab5eb8683f47f1"
};
// ══════════════════════════════════════════

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const ROLES = [
  {id:1,name:"辣子鸡丁",skill:"火辣袭击（1次）：本轮同格其他军队-3"},
  {id:2,name:"炸鸡桶",skill:"炸鸡（前4轮1次）：摧毁目标城所有兵，获同等分"},
  {id:3,name:"可乐鸡翅",skill:"甜咸互换（3次，5/6轮1次）：秘密调换两城价值，差≤6"},
  {id:4,name:"浓鸡汤",skill:"鸡汤慢炖：所有人选完后，看一名玩家放置再决定"},
  {id:5,name:"左宗鸡",skill:"倒数加餐：选一玩家，若本轮得分最低三名之一获10分"},
  {id:6,name:"黄焖鸡米饭",skill:"双倍滋味（3次，5/6轮1次）：选城胜翻倍，败扣分"},
  {id:7,name:"鸳鸯鸡",skill:"口味双拼（3次，5/6轮1次）：公开合作，各放17兵，收益平分"},
  {id:8,name:"泡椒鸡爪",skill:"偷点零食：若本轮总榜唯一最低，偷所有人各2分"},
  {id:9,name:"大盘鸡",skill:"加量吃撑（3次，5/6轮1次）：额外最多12兵，未得分兵每个-2"},
  {id:10,name:"酱油鸡",skill:"放点酱油（3次，5/6轮1次）：公布后计分前移动1枚兵"},
  {id:11,name:"白斩鸡拼盘",skill:"切准肥瘦：每轮预测总榜排名，猜对一人+2分（不翻倍）"},
  {id:12,name:"口水鸡",skill:"半块添香：军队可按0.5使用"}
];

const COLORS = ["#c9a84c","#4c7ec9","#c94c4c","#4caa7c","#9f6bc9","#c97e4c","#4cbcc9","#c94c8a","#7ec94c","#c9c94c","#4c4cc9","#c94c4c"];

let myId = null, myName = '', myRoom = '', isHost = false, myRole = null;
let roomRef = null, unsubscribers = [];

function genCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  return Array.from({length:4},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
}

function showToast(msg, dur=2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), dur);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
}

// ── 创建房间 ──
window.createRoom = async function() {
  const name = document.getElementById('host-name').value.trim();
  if(!name) { showToast('请输入你的名字'); return; }
  const code = genCode();
  myId = 'p_' + Date.now();
  myName = name;
  myRoom = code;
  isHost = true;

  await set(ref(db, `rooms/${code}`), {
    host: myId,
    round: 0,
    phase: 'lobby',
    players: { [myId]: { name, color: COLORS[0], roleId: 0, ready: false } }
  });

  roomRef = ref(db, `rooms/${code}`);
  listenRoom();
  showScreen('lobby');
  document.getElementById('lobby-code').textContent = code;
  document.getElementById('host-controls').innerHTML = `<button class="btn btn-gold btn-sm" onclick="startGame()">开始游戏</button>`;
  buildRoleSelectGrid();
  document.getElementById('role-assignment-card').style.display = 'block';
};

// ── 加入房间 ──
window.joinRoom = async function() {
  const code = document.getElementById('join-code').value.trim().toUpperCase();
  const name = document.getElementById('join-name').value.trim();
  if(!code || code.length!==4) { showToast('请输入4位房间码'); return; }
  if(!name) { showToast('请输入你的名字'); return; }

  const snap = await get(ref(db, `rooms/${code}`));
  if(!snap.exists()) { showToast('房间不存在'); return; }
  const data = snap.val();
  const players = data.players || {};
  const count = Object.keys(players).length;
  if(count >= 12) { showToast('房间已满'); return; }
  if(Object.values(players).some(p=>p.name===name)) { showToast('名字已被使用'); return; }

  myId = 'p_' + Date.now() + Math.random().toString(36).slice(2,6);
  myName = name;
  myRoom = code;
  isHost = false;

  await set(ref(db, `rooms/${code}/players/${myId}`), {
    name, color: COLORS[count % COLORS.length], roleId: 0, ready: false
  });

  roomRef = ref(db, `rooms/${code}`);
  listenRoom();
  showScreen('lobby');
  document.getElementById('lobby-code').textContent = code;
  buildRoleSelectGrid();
  document.getElementById('role-assignment-card').style.display = 'block';
};

function buildRoleSelectGrid() {
  const grid = document.getElementById('role-select-grid');
  grid.innerHTML = ROLES.map(r=>`
    <div class="role-option" id="role-opt-${r.id}" onclick="toggleRole(${r.id})">
      <div class="role-option-name">${r.name}</div>
      <div class="role-option-skill">${r.skill}</div>
    </div>`).join('');
}

let selectedRoles = [];
window.toggleRole = function(id) {
  const idx = selectedRoles.indexOf(id);
  if(idx>=0) {
    selectedRoles.splice(idx,1);
    document.getElementById('role-opt-'+id).classList.remove('selected');
  } else {
    if(selectedRoles.length >= 4) { showToast('最多选4个'); return; }
    selectedRoles.push(id);
    document.getElementById('role-opt-'+id).classList.add('selected');
  }
};

window.submitRolePref = async function() {
  if(selectedRoles.length === 0) { showToast('至少选1个角色偏好'); return; }
  await update(ref(db, `rooms/${myRoom}/players/${myId}`), { rolePrefs: selectedRoles });
  showToast('已提交偏好 ✓');
};

// ── 主持人开始游戏 ──
window.startGame = async function() {
  const snap = await get(ref(db, `rooms/${myRoom}/players`));
  const players = snap.val() || {};
  const pList = Object.entries(players).map(([id,p])=>({id,...p}));
  if(pList.length < 2) { showToast('至少需要2名玩家'); return; }

  // 分配角色
  const shuffledRoles = [...ROLES].sort(()=>Math.random()-.5);
  const assigned = {};
  const usedRoles = new Set();

  // 先尽量满足偏好
  pList.forEach(p=>{
    const prefs = p.rolePrefs || [];
    for(const rid of prefs) {
      if(!usedRoles.has(rid)) { assigned[p.id] = rid; usedRoles.add(rid); break; }
    }
  });
  // 没分到的随机分
  pList.forEach(p=>{
    if(!assigned[p.id]) {
      const r = shuffledRoles.find(r=>!usedRoles.has(r.id));
      if(r) { assigned[p.id] = r.id; usedRoles.add(r.id); }
    }
  });

  const updates = {};
  pList.forEach(p=>{ updates[`players/${p.id}/roleId`] = assigned[p.id] || 1; });
  updates['round'] = 1;
  updates['phase'] = 'deploy';
  updates['deploys'] = {};
  await update(ref(db, `rooms/${myRoom}`), updates);
};

// ── 监听房间 ──
function listenRoom() {
  const unsub = onValue(roomRef, snap=>{
    if(!snap.exists()) return;
    const data = snap.val();
    renderLobby(data);
    if(data.phase === 'deploy') renderDeploy(data);
    if(data.phase === 'result') renderResult(data);
    if(data.phase === 'final') renderFinal(data);
  });
  unsubscribers.push(unsub);
}

// ── 大厅 ──
function renderLobby(data) {
  if(data.phase !== 'lobby' && data.phase !== 'deploy') return;
  const players = Object.entries(data.players||{}).map(([id,p])=>({id,...p}));
  document.getElementById('player-count').textContent = players.length;
  const list = document.getElementById('player-list');
  list.innerHTML = players.map(p=>{
    const role = ROLES.find(r=>r.id===p.roleId);
    return `<div class="player-item">
      <div class="avatar" style="background:${p.color}22;color:${p.color}">${p.name.slice(0,2)}</div>
      <div class="player-info">
        <div class="player-name">${p.name}${p.id===myId?' <span style="font-size:11px;color:var(--text3)">(你)</span>':''}</div>
        <div class="player-role">${role?role.name:'未分配'}</div>
      </div>
      <span class="badge ${p.rolePrefs?'badge-green':''}">${p.rolePrefs?'已选偏好':'待选'}</span>
    </div>`;
  }).join('');
}

// ── 部署阶段 ──
let currentDeployData = {};

function renderDeploy(data) {
  if(data.phase !== 'deploy') return;
  showScreen('deploy');

  const round = data.round;
  const isDouble = round >= 5;
  document.getElementById('round-label').textContent = `第${round}轮${isDouble?' · 双倍得分':''}`;
  document.getElementById('deploy-title').textContent = '秘密部署军队';
  document.getElementById('round-badge').textContent = `${round}/6`;
  if(isDouble) document.getElementById('round-badge').className = 'badge badge-gold';

  // 我的角色
  const me = data.players[myId];
  if(me) {
    myRole = ROLES.find(r=>r.id===me.roleId);
    const roleDisplay = document.getElementById('my-role-display');
    if(myRole) roleDisplay.innerHTML = `<div class="my-role-name">${myRole.name}</div><div class="my-role-skill">${myRole.skill}</div>`;
  }

  // 检查我是否已提交
  const myDeploy = data.deploys && data.deploys[myId];
  if(myDeploy && myDeploy.submitted) {
    document.getElementById('deploy-form').style.display = 'none';
    document.getElementById('submitted-overlay').style.display = 'block';
    renderWaiting(data);
  } else {
    document.getElementById('deploy-form').style.display = 'block';
    document.getElementById('submitted-overlay').style.display = 'none';
    buildCityGrid(round);
  }

  // 检查是否所有人都提交了（主持人自动结算）
  if(isHost) {
    const players = Object.keys(data.players||{});
    const deploys = data.deploys || {};
    const allDone = players.every(pid => deploys[pid]?.submitted);
    if(allDone && players.length >= 2) calcResult(data);
  }
}

function renderWaiting(data) {
  const players = Object.entries(data.players||{}).map(([id,p])=>({id,...p}));
  const deploys = data.deploys || {};
  const list = document.getElementById('waiting-list');
  list.innerHTML = players.map(p=>{
    const done = deploys[p.id]?.submitted;
    const isMe = p.id === myId;
    return `<div class="waiting-item">
      <div class="dot ${done?'done':''} ${isMe?'me':''}"></div>
      <span>${p.name}${isMe?' (你)':''}</span>
      <span style="margin-left:auto;font-size:11px;color:${done?'var(--green)':'var(--text3)'}">${done?'已提交':'等待中…'}</span>
    </div>`;
  }).join('');
}

function buildCityGrid(round) {
  const isDouble = round >= 5;
  const grid = document.getElementById('city-grid');
  if(!currentDeployData[round]) currentDeployData[round] = Array(17).fill(0);
  grid.innerHTML = '';
  for(let c=1;c<=16;c++){
    const cell = document.createElement('div');
    cell.className = 'city-cell';
    cell.innerHTML = `<div class="city-num">${c}号${isDouble?'<div class="city-double">×2</div>':''}</div>
      <input type="number" min="0" max="12" step="${myRole?.id===12?0.5:1}" value="${currentDeployData[round][c]||''}" placeholder="0"
        oninput="updateDeploy(${round},${c},this.value)" />`;
    grid.appendChild(cell);
  }
  updateArmyBar(round);
}

window.updateDeploy = function(round, city, val) {
  currentDeployData[round][city] = parseFloat(val)||0;
  updateArmyBar(round);
};

function updateArmyBar(round) {
  const data = currentDeployData[round] || Array(17).fill(0);
  const total = data.slice(1).reduce((a,b)=>a+b,0);
  const pct = Math.min(100, total/12*100);
  document.getElementById('army-fill').style.width = pct+'%';
  const countEl = document.getElementById('army-count');
  countEl.textContent = total + ' / 12';
  countEl.className = 'army-count' + (total > 12 ? ' army-warn' : '');
}

window.submitDeploy = async function() {
  const snap = await get(ref(db, `rooms/${myRoom}`));
  const data = snap.val();
  const round = data.round;
  const deployData = currentDeployData[round] || Array(17).fill(0);
  const total = deployData.slice(1).reduce((a,b)=>a+b,0);
  if(Math.abs(total-12)>0.01) { showToast(`军队总数必须=12（当前${total}）`); return; }

  await set(ref(db, `rooms/${myRoom}/deploys/${myId}`), {
    submitted: true,
    troops: deployData.slice(1)
  });
  showToast('提交成功！');
};

// ── 主持人结算 ──
async function calcResult(data) {
  const round = data.round;
  const isDouble = round >= 5;
  const players = Object.entries(data.players).map(([id,p])=>({id,...p}));
  const deploys = data.deploys;

  const cityWinners = {};
  for(let c=1;c<=16;c++){
    const troops = {};
    players.forEach(p=>{
      troops[p.id] = (deploys[p.id]?.troops?.[c-1]) || 0;
    });
    const max = Math.max(...Object.values(troops));
    if(max === 0) { cityWinners[c] = {winner:null,max:0,troops}; continue; }
    const winners = players.filter(p=>troops[p.id]===max);
    cityWinners[c] = { winner: winners.length===1?winners[0].id:null, max, troops };
  }

  const roundScores = {};
  players.forEach(p=>{ roundScores[p.id] = 0; });
  for(let c=1;c<=16;c++){
    const w = cityWinners[c].winner;
    if(w) roundScores[w] += isDouble ? c*2 : c;
  }

  const totalScores = {};
  players.forEach(p=>{
    const prev = data.totalScores?.[p.id] || 0;
    totalScores[p.id] = prev + roundScores[p.id];
  });

  await update(ref(db, `rooms/${myRoom}`), {
    phase: round >= 6 ? 'final' : 'result',
    lastRound: round,
    cityWinners,
    roundScores,
    totalScores,
    deploys: {}
  });
}

// ── 结算页 ──
function renderResult(data) {
  showScreen('result');
  const round = data.lastRound;
  const isDouble = round >= 5;
  document.getElementById('result-round-label').textContent = `第${round}轮${isDouble?' · 双倍':''} 结算`;
  document.getElementById('result-round-badge').textContent = `${round}/6`;

  const players = Object.entries(data.players).map(([id,p])=>({id,...p}));
  const cityWinners = data.cityWinners || {};
  const roundScores = data.roundScores || {};
  const totalScores = data.totalScores || {};

  // 城池结果
  const cityGrid = document.getElementById('city-result-grid');
  cityGrid.innerHTML = '';
  for(let c=1;c<=16;c++){
    const cw = cityWinners[c];
    const pts = isDouble?c*2:c;
    const cell = document.createElement('div');
    cell.className = 'city-result-cell' + (cw?.winner?' won':' tie');
    if(cw?.winner){
      const p = players.find(p=>p.id===cw.winner);
      cell.innerHTML = `<div class="city-pts">${c}号 +${pts}</div><div class="city-winner">${p?p.name:'?'}</div>`;
    } else {
      cell.innerHTML = `<div class="city-pts">${c}号</div><div class="city-tie">流局</div>`;
    }
    cityGrid.appendChild(cell);
  }

  // 本轮得分
  const sorted = players.map(p=>({...p,round:roundScores[p.id]||0,total:totalScores[p.id]||0}))
    .sort((a,b)=>b.round-a.round);
  document.getElementById('round-scores').innerHTML = sorted.map((p,i)=>{
    const cls = i===0?'r1':i===1?'r2':i===2?'r3':'';
    return `<div class="score-row">
      <div class="score-rank ${cls}">${i+1}</div>
      <div class="avatar" style="background:${p.color}22;color:${p.color};width:30px;height:30px;font-size:12px">${p.name.slice(0,2)}</div>
      <div class="player-info"><div class="player-name">${p.name}</div></div>
      <div style="text-align:right">
        <div class="score-pts" style="font-size:18px">${p.round>0?'+':''}${p.round}</div>
        <div class="score-delta">累计 ${p.total}</div>
      </div>
    </div>`;
  }).join('');

  if(isHost) {
    document.getElementById('host-next-btn').style.display = round < 6 ? 'block' : 'none';
    document.getElementById('game-over-btn').style.display = round >= 6 ? 'block' : 'none';
  }
}

window.nextRound = async function() {
  const snap = await get(ref(db,`rooms/${myRoom}`));
  const data = snap.val();
  await update(ref(db,`rooms/${myRoom}`), {
    round: data.lastRound + 1,
    phase: 'deploy',
    deploys: {}
  });
};

window.showFinal = async function() {
  await update(ref(db,`rooms/${myRoom}`), { phase: 'final' });
};

// ── 最终排名 ──
function renderFinal(data) {
  showScreen('final');
  const players = Object.entries(data.players).map(([id,p])=>({id,...p}));
  const totalScores = data.totalScores || {};
  const sorted = players.map(p=>({...p,total:totalScores[p.id]||0})).sort((a,b)=>b.total-a.total);

  document.getElementById('final-scores').innerHTML = sorted.map((p,i)=>{
    const cls = i===0?'r1':i===1?'r2':i===2?'r3':'';
    const role = ROLES.find(r=>r.id===p.roleId);
    return `<div class="score-row">
      <div class="score-rank ${cls}">${i+1}</div>
      <div class="avatar" style="background:${p.color}22;color:${p.color}">${p.name.slice(0,2)}</div>
      <div class="player-info">
        <div class="player-name">${p.name}${i===0?' 🏆':''}</div>
        <div class="player-role">${role?role.name:''}</div>
      </div>
      <div class="score-pts">${p.total}</div>
    </div>`;
  }).join('');
}

</script>
